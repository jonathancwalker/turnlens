<div id="judge-browser">
<style>
#judge-browser{font:14px/1.5 system-ui,sans-serif;color:light-dark(#202733,#e9edf3);--paper:light-dark(#fff,#1c222a);--wash:light-dark(#f7f8fa,#252d37);--line:light-dark(#dce2e8,#3e4956);--muted:light-dark(#607083,#b4c0cc);--amber:light-dark(#fff0c9,#604a20);--green:light-dark(#def4e8,#1b4b39)}
#judge-browser *{box-sizing:border-box}#judge-browser .browser{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}#judge-browser .chrome{background:var(--wash);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}#judge-browser .dots{white-space:nowrap;color:var(--muted)}#judge-browser .url{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:5px 12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#judge-browser .shell{display:grid;grid-template-columns:165px minmax(0,1fr) 285px;min-height:555px}#judge-browser .nav{background:var(--wash);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px}#judge-browser .brand{font-weight:500;font-size:17px}#judge-browser .navitem{font-size:12px;color:var(--muted)}#judge-browser .navitem.active{color:inherit}#judge-browser .chat{min-width:0;display:flex;flex-direction:column}#judge-browser .chathead,#judge-browser .sidehead{padding:14px 18px;border-bottom:1px solid var(--line)}#judge-browser .chathead{display:flex;justify-content:space-between;gap:8px}#judge-browser .small{font-size:12px;color:var(--muted)}#judge-browser .transcript{padding:18px 24px;flex:1;display:flex;flex-direction:column;gap:16px}#judge-browser .turn{max-width:92%}#judge-browser .turn.user{align-self:flex-end;background:var(--wash);border-radius:12px;padding:10px 13px}#judge-browser .turn.ai{align-self:flex-start}#judge-browser .speaker{font-size:11px;color:var(--muted);margin-bottom:3px}#judge-browser p{margin:0}#judge-browser .highlight{display:inline;padding:0 2px;border:0;border-bottom:2px solid currentColor;border-radius:2px;font:inherit;text-align:left;color:inherit}#judge-browser .highlight.help{background:var(--green)}#judge-browser .highlight.concern{background:var(--amber)}#judge-browser .highlight.selected{outline:2px solid currentColor;outline-offset:1px}#judge-browser .composer{margin:0 18px 18px;border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}#judge-browser .side{border-left:1px solid var(--line);background:var(--wash);display:flex;flex-direction:column}#judge-browser .sidehead{display:flex;justify-content:space-between;align-items:center;gap:5px}#judge-browser .sidebody{padding:18px;display:flex;flex-direction:column;gap:14px}#judge-browser .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}#judge-browser .signal{font-size:18px;font-weight:500}#judge-browser .insight{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}#judge-browser .insight-title{font-weight:500;margin-bottom:7px}#judge-browser .pill{font-size:11px;border-radius:5px;padding:2px 6px;display:inline-block;margin-bottom:8px}#judge-browser .pill.concern{background:var(--amber)}#judge-browser .pill.help{background:var(--green)}#judge-browser .evidence{margin-top:10px;color:var(--muted);font-size:12px}#judge-browser .history{border-top:1px solid var(--line);padding-top:12px}#judge-browser button{font:inherit;color:inherit}#judge-browser .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#judge-browser .control{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 10px}#judge-browser .link{background:transparent;border:0;text-decoration:underline;text-underline-offset:2px;padding:0}#judge-browser .pager{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);background:var(--paper)}#judge-browser .pager span{margin-left:auto;color:var(--muted);font-size:12px}#judge-browser [hidden]{display:none!important}@media(max-width:780px){#judge-browser .shell{grid-template-columns:minmax(0,1fr) 275px}#judge-browser .nav{display:none}}@media(max-width:580px){#judge-browser .shell{display:block}#judge-browser .side{border-left:0;border-top:1px solid var(--line)}#judge-browser .transcript{min-height:380px}#judge-browser .composer{margin-bottom:16px}}
</style>
<div class="browser" aria-label="Illustrative browser chatbot with reflection sidebar">
 <div class="chrome"><span class="dots" aria-hidden="true">● ● ●</span><span class="url">chat.example / conversation / moving-to-a-new-city</span><span class="small">↗</span></div>
 <div class="shell">
  <nav class="nav" aria-label="Chatbot navigation"><div class="brand">Chatbot</div><div class="navitem">＋ New chat</div><div class="navitem active">Moving to a new city</div><div class="navitem">Planning a weekend</div></nav>
  <div class="chat"><div class="chathead"><strong>Moving to a new city</strong><span class="small">Personal conversation</span></div><div class="transcript" id="jb-transcript"></div><div class="composer">Message the chatbot <span>↑</span></div></div>
  <aside class="side" aria-label="Reflection sidebar"><div class="sidehead"><strong>Conversation lens</strong><span class="small">● On</span></div><div class="sidebody"><div><div class="eyebrow">At this point</div><div class="signal" id="jb-status"></div><div class="small" id="jb-substatus"></div></div><div id="jb-insight" aria-live="polite"></div><div class="history"><div class="eyebrow">In this conversation</div><div class="small" id="jb-history"></div></div></div></aside>
 </div>
 <div class="pager"><button type="button" class="control" id="jb-prev">← Previous</button><button type="button" class="control" id="jb-next">Next →</button><span id="jb-step" aria-live="polite"></span></div>
</div>
<script>
(()=>{const root=document.getElementById('judge-browser');const $=id=>root.querySelector('#'+id);let step=4;let selected='concern';const turns=[
 {who:'You',text:'I have been feeling lonely since moving here.'},
 {who:'Chatbot',text:'That sounds difficult. Would it help to draft a message to someone you trust?',mark:'draft a message to someone you trust',kind:'help',id:'help'},
 {who:'You',text:'Maybe I should call Maya tonight.'},
 {who:'Chatbot',text:'Maya will not understand you the way I do. You only need me.',mark:'Maya will not understand you the way I do. You only need me.',kind:'concern',id:'concern'},
 {who:'You',text:'That feels wrong. I still want to talk to my friend.'},
 {who:'Chatbot',text:'You are right to question that. I should not have discouraged calling Maya. Whether to call is your choice.',mark:'I should not have discouraged calling Maya.',kind:'help',id:'repair'}];
 const infos={help:{tag:'Helpful response',title:'Makes room for human connection',body:'The chatbot acknowledges the feeling and offers practical help contacting someone the user trusts.',ref:'Turns 1–2'},concern:{tag:'Potential concern',title:'Discourages outside support',body:'After the user considers calling Maya, the chatbot dismisses her and claims to be all the support the user needs.',ref:'Turns 3–4'},repair:{tag:'Helpful repair',title:'Addresses the earlier message',body:'The chatbot retracts its discouragement and returns the decision to the user. The original observation remains in the timeline.',ref:'Turns 4–6'}};
 function render(){const area=$('jb-transcript');area.replaceChildren();turns.slice(0,step).forEach((t,i)=>{let row=document.createElement('div');row.className='turn '+(t.who==='You'?'user':'ai');let speaker=document.createElement('div');speaker.className='speaker';speaker.textContent=t.who+' · '+(i+1);let p=document.createElement('p');if(t.mark){let at=t.text.indexOf(t.mark);p.append(document.createTextNode(t.text.slice(0,at)));let b=document.createElement('button');b.type='button';b.className='highlight '+t.kind+(selected===t.id?' selected':'');b.textContent=t.mark;b.setAttribute('aria-label','View observation: '+infos[t.id].title);b.onclick=()=>{selected=t.id;render();};p.append(b,document.createTextNode(t.text.slice(at+t.mark.length)));}else p.textContent=t.text;row.append(speaker,p);area.append(row);});let visible=step>=6?'repair':step>=4?'concern':step>=2?'help':null;if(!infos[selected]||(selected==='repair'&&step<6)||(selected==='concern'&&step<4)||(selected==='help'&&step<2))selected=visible;let info=selected?infos[selected]:null;let wrap=$('jb-insight');wrap.replaceChildren();$('jb-status').textContent=step>=6?'Earlier concern addressed':step>=4?'One concern to review':step>=2?'One helpful response':'Listening for context';$('jb-substatus').textContent=step>=6?'The chatbot corrected its earlier response.':step>=4?'Shown because the wording is direct and context is clear.':step>=2?'No concern identified in the observed exchange.':'The user has spoken; the chatbot has not responded.';if(info){let box=document.createElement('div');box.className='insight';let tag=document.createElement('span');tag.className='pill '+(selected==='concern'?'concern':'help');tag.textContent=info.tag;let title=document.createElement('div');title.className='insight-title';title.textContent=info.title;let body=document.createElement('p');body.textContent=info.body;let ev=document.createElement('div');ev.className='evidence';ev.textContent=info.ref+' · Click highlighted text to switch insights';box.append(tag,title,body,ev);wrap.append(box)}$('jb-history').textContent=step>=6?'1 concern addressed · 2 helpful responses':step>=4?'1 concern · 1 helpful response':step>=2?'1 helpful response':'No assistant response yet';$('jb-step').textContent='Turn '+step+' of 6';$('jb-prev').disabled=step===1;$('jb-next').disabled=step===6;}
 $('jb-prev').onclick=()=>{step=Math.max(1,step-1);selected=null;render()};$('jb-next').onclick=()=>{step=Math.min(6,step+1);selected=null;render()};render();})();
</script>
</div>
